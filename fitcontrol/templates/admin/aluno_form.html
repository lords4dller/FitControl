{% extends "base.html" %}
{% block titulo %}Cadastrar aluno · FitControl{% endblock %}
{% block conteudo %}
<h1>Cadastrar aluno</h1>

<form class="cartao formulario" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% include "admin/_conta.html" %}

  <div class="grade-campos">
    <div>
      <label for="treinador_id">Treinador</label>
      <select id="treinador_id" name="treinador_id">
        <option value="">Sem treinador</option>
        {% for treinador in treinadores %}
        <option value="{{ treinador.id }}"{% if dados.get('treinador_id') == treinador.id|string %} selected{% endif %}>{{ treinador.usuario.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="data_nascimento">Data de nascimento</label>
      <input id="data_nascimento" name="data_nascimento" type="date" value="{{ dados.get('data_nascimento', '') }}">
    </div>
    <div>
      <label for="sexo">Sexo</label>
      <select id="sexo" name="sexo">
        <option value="">Não informado</option>
        {% for opcao in sexos %}
        <option{% if dados.get('sexo') == opcao %} selected{% endif %}>{{ opcao }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="telefone">Telefone</label>
      <input id="telefone" name="telefone" type="tel" maxlength="20" value="{{ dados.get('telefone', '') }}">
    </div>
    <div>
      <label for="endereco">Endereço</label>
      <input id="endereco" name="endereco" type="text" maxlength="200" value="{{ dados.get('endereco', '') }}">
    </div>
    <div>
      <label for="contato_emergencia">Contato de emergência</label>
      <input id="contato_emergencia" name="contato_emergencia" type="text" maxlength="120" value="{{ dados.get('contato_emergencia', '') }}">
    </div>
  </div>

  <div class="acoes">
    <button class="botao" type="submit">Cadastrar</button>
    <a class="botao botao-discreto" href="{{ url_for('admin.alunos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
